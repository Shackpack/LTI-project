version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lti-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lti-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: lti_db
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - lti-network

volumes:
  postgres_data:

networks:
  lti-network:
    driver: bridge
